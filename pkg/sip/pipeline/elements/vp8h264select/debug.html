<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VP8/H264 Select - Pad Switcher</title>
<style>
  body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #e0e0e0; }
  h1 { font-size: 16px; margin-bottom: 16px; }
  .pad-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .pad {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border: 1px solid #444;
    background: #222;
  }
  .pad:hover { background: #333; }
  .pad.active { border-color: #2a6; background: #1a2e1a; }
  .pad-name { font-weight: bold; flex: 1; }
  .pad-status { font-size: 12px; color: #888; }
  .pad.active .pad-status { color: #2a6; }
  .pad-btn {
    padding: 3px 8px; font-size: 11px; font-family: monospace; cursor: pointer;
    border: 1px solid #555; background: #333; color: #ccc;
  }
  .pad-btn:hover { background: #444; }
  .pad-btn.force { border-color: #a62; color: #fa3; }
  .pad-btn.force:hover { background: #3a2a1a; }
  .status { margin-top: 8px; font-size: 12px; color: #888; }
  .status.error { color: #f44; }
  .empty { color: #888; }
</style>
</head>
<body>
<h1>VP8/H264 Select - Pad Switcher</h1>
<div id="pads" class="pad-list"></div>
<div id="status" class="status"></div>

<script>
let pads = [];

async function refresh() {
  try {
    const resp = await fetch('api/pads');
    pads = await resp.json();
    render();
  } catch (e) {
    setStatus('Fetch error: ' + e.message, true);
  }
}

function render() {
  const container = document.getElementById('pads');
  container.innerHTML = '';
  if (!pads || pads.length === 0) {
    container.innerHTML = '<div class="empty">No sink pads</div>';
    return;
  }
  pads.sort((a, b) => a.name.localeCompare(b.name));
  for (const p of pads) {
    const div = document.createElement('div');
    div.className = 'pad' + (p.active ? ' active' : '');
    div.innerHTML = '<span class="pad-name">' + esc(p.name) + '</span>' +
      '<span class="pad-status">' + (p.active ? 'active' : 'inactive') + '</span>' +
      '<button class="pad-btn" onclick="event.stopPropagation(); switchPad(\'' + esc(p.name) + '\')">switch</button>' +
      '<button class="pad-btn force" onclick="event.stopPropagation(); forceSwitchPad(\'' + esc(p.name) + '\')">force</button>';
    container.appendChild(div);
  }
}

async function switchPad(name) {
  try {
    const resp = await fetch('api/switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pad: name }),
    });
    if (!resp.ok) {
      const text = await resp.text();
      setStatus('Error: ' + text, true);
      return;
    }
    setStatus('Switched to ' + name + ' (via event)', false);
    setTimeout(refresh, 300);
  } catch (e) {
    setStatus('Error: ' + e.message, true);
  }
}

async function forceSwitchPad(name) {
  try {
    const resp = await fetch('api/force-switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pad: name }),
    });
    if (!resp.ok) {
      const text = await resp.text();
      setStatus('Error: ' + text, true);
      return;
    }
    setStatus('Force-switched to ' + name + ' (direct property)', false);
    setTimeout(refresh, 300);
  } catch (e) {
    setStatus('Error: ' + e.message, true);
  }
}

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isError ? ' error' : '');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
